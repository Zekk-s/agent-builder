name: Feature Request
description: Propose a change to this repository.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the change you want and which files it would touch.
        The current app is the Vite page in `frontend/`.

  - type: input
    id: title
    attributes:
      label: Short title
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: textarea
    id: files
    attributes:
      label: Files this would touch
    validations:
      required: false
