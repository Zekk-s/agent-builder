name: Feature Request
description: Propose a new node type, edge capability, or UX feature.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the feature you want, why it matters, and how it should behave.

  - type: input
    id: title
    attributes:
      label: Short title
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: textarea
    id: impact
    attributes:
      label: Persistence / export format impact
    validations:
      required: false