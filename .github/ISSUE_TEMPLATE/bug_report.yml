name: Bug Report
description: Report broken behavior or unexpected output from agent-builder.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Complete the template below.

  - type: input
    id: summary
    attributes:
      label: One-line summary
      placeholder: e.g. Cannot delete edge after multi-select
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: Browser, OS, build
      placeholder: Chrome 130 · macOS 14.5 · agent-builder@0.1.0
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Browser console output
      render: shell
    validations:
      required: false